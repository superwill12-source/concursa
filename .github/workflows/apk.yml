name: Gerar APK do Concursa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Criar projeto Android
        run: |
          flutter create app --project-name concursa --platforms android --org br.com.concursa
          rm -f app/test/widget_test.dart
          cp pubspec.yaml app/pubspec.yaml
          mkdir -p app/lib
          cp main.dart question.dart database_service.dart home_screen.dart questions_screen.dart simulado_screen.dart import_screen.dart progress_screen.dart app/lib/

      - name: Definir compileSdk 36 (exigido pelos plugins)
        run: |
          ARQ_KTS=app/android/app/build.gradle.kts
          ARQ_GROOVY=app/android/app/build.gradle
          if [ -f "$ARQ_KTS" ]; then
            sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/' "$ARQ_KTS"
          fi
          if [ -f "$ARQ_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/' "$ARQ_GROOVY"
          fi
          echo "Linhas de compileSdk após a troca:"
          grep -n "compileSdk" app/android/app/build.gradle* || true
          if ! grep -qE "compileSdk(Version)? ?=? ?36" app/android/app/build.gradle*; then
            echo "::error::Não consegui definir compileSdk 36. Veja as linhas acima."
            exit 1
          fi

      - name: Forçar compileSdk 36 também nos plugins
        run: |
          ARQ=app/android/build.gradle.kts
          if [ ! -f "$ARQ" ]; then
            echo "::error::Arquivo $ARQ não encontrado"
            exit 1
          fi
          cat >> "$ARQ" <<'KTS'

subprojects {
    afterEvaluate {
        val ext = extensions.findByName("android")
        if (ext != null) {
            try {
                ext.javaClass.getMethod("setCompileSdk", Integer::class.java).invoke(ext, 36)
            } catch (e: NoSuchMethodException) {
                ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
            }
        }
    }
}
KTS
          echo "Final de $ARQ:"
          tail -n 16 "$ARQ"

      - name: Permitir internet no app
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml
          grep -c "INTERNET" app/android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        working-directory: app
        run: flutter pub get

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release

      - name: Renomear APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk concursa.apk

      - name: Guardar APK nos artefatos
        uses: actions/upload-artifact@v4
        with:
          name: concursa-apk
          path: concursa.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Concursa v${{ github.run_number }}
          files: concursa.apk
