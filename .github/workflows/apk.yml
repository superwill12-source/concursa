name: Build Android APK

on:
workflow_dispatch:
push:
paths:
- '**'
- '.github/workflows/apk.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Concursa
    uses: actions/checkout@v4

  - name: Locate Flutter project
    id: project
    shell: bash
    run: |
      set -e
      FILE="$(find . -type f -name pubspec.yaml \
        -not -path './.git/*' \
        -not -path '*/.dart_tool/*' | head -n 1)"

      if [ -z "$FILE" ]; then
        echo "Não encontrei pubspec.yaml."
        echo "Arquivos existentes:"
        find . -maxdepth 3 -type f | head -n 100
        exit 1
      fi

      DIR="$(dirname "$FILE")"
      echo "dir=$DIR" >> "$GITHUB_OUTPUT"
      echo "Projeto encontrado em: $DIR"

  - name: Install Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build Concursa APK
    working-directory: ${{ steps.project.outputs.dir }}
    run: |
      flutter pub get
      flutter build apk --release

  - name: Upload Concursa APK
    uses: actions/upload-artifact@v4
    with:
      name: Concursa-APK
      path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
      if-no-files-found: error
      retention-days: 7
