name: Concursa APK

'on':
workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2


  - uses: subosito/flutter-action@v2

  - name: Show project files
    run: |
      pwd
      ls -la
      find . -maxdepth 3 -type f | sort | head -100
