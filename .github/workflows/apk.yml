name: Build Android APK

on:
push:
paths:
- 'Minimalista-Launcher-Projeto.zip'
- '.github/workflows/android.yml'
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Install Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Install Android SDK
    uses: android-actions/setup-android@v3

  - name: Extract project
    shell: bash
    run: |
      set -e
      ZIP=$(find . -maxdepth 3 -type f -name 'Minimalista-Launcher-Projeto.zip' | head -n 1)
      if [ -z "$ZIP" ]; then
        echo "ERRO: Minimalista-Launcher-Projeto.zip não encontrado."
        exit 1
      fi
      mkdir -p build-source
      unzip -o "$ZIP" -d build-source

  - name: Locate project
    id: project
    shell: bash
    run: |
      set -e
      FLUTTER_FILE=$(find build-source -type f -name pubspec.yaml -not -path '*/.dart_tool/*' | head -n 1)
      if [ -n "$FLUTTER_FILE" ]; then
        DIR=$(dirname "$FLUTTER_FILE")
        echo "type=flutter" >> "$GITHUB_OUTPUT"
        echo "dir=$DIR" >> "$GITHUB_OUTPUT"
        echo "Flutter project: $DIR"
        exit 0
      fi

      for FILE in $(find build-source -type f \( -name build.gradle -o -name build.gradle.kts \)); do
        DIR=$(dirname "$FILE")
        if [ "$(basename "$DIR")" = "app" ] && [ -f "$DIR/../settings.gradle" -o -f "$DIR/../settings.gradle.kts" ]; then
          echo "type=gradle" >> "$GITHUB_OUTPUT"
          echo "dir=$(dirname "$DIR")" >> "$GITHUB_OUTPUT"
          echo "Android project: $(dirname "$DIR")"
          exit 0
        fi
      done

      echo "ERRO: não encontrei um projeto Android válido dentro do ZIP."
      find build-source -maxdepth 5 -type f | head -n 100
      exit 1

  - name: Install Flutter
    if: steps.project.outputs.type == 'flutter'
    uses: subosito/flutter-action@v2
    with:
      channel: stable

  - name: Build Flutter APK
    if: steps.project.outputs.type == 'flutter'
    working-directory: ${{ steps.project.outputs.dir }}
    run: |
      flutter pub get
      flutter build apk --debug

  - name: Setup Gradle
    if: steps.project.outputs.type == 'gradle'
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build native Android APK
    if: steps.project.outputs.type == 'gradle'
    working-directory: ${{ steps.project.outputs.dir }}
    run: gradle assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Minimalista-Launcher-APK
      path: |
        build-source/**/build/outputs/apk/debug/*.apk
        build-source/**/build/app/outputs/flutter-apk/*.apk
      if-no-files-found: error
      retention-days: 7
