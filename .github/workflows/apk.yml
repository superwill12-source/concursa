name: Gerar APK do Concursa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar arquivos Dart na raiz
        run: |
          for f in main.dart question.dart database_service.dart home_screen.dart questions_screen.dart simulado_screen.dart import_screen.dart progress_screen.dart; do
            if [ ! -f "$f" ]; then
              echo "::error::Arquivo ausente na raiz do repositório: $f"
              exit 1
            fi
          done

      - name: Criar projeto Android e copiar todos os arquivos
        run: |
          flutter create app --project-name concursa --platforms android --org br.com.concursa
          cp pubspec.yaml app/pubspec.yaml
          rm -f app/test/widget_test.dart
          mkdir -p app/lib
          cp main.dart question.dart database_service.dart home_screen.dart questions_screen.dart simulado_screen.dart import_screen.dart progress_screen.dart app/lib/
          echo "Arquivos copiados para app/lib:"
          ls -la app/lib

      - name: Configurar SDK Android para dependências atuais
        run: |
          - name: Configure Android SDK
  shell: bash
  run: |
    FILE=$(find . -type f \( -name "build.gradle.kts" -o -name "build.gradle" \) -path "*/app/*" | head -n 1)
    if [ -z "$FILE" ]; then
      echo "ERRO: arquivo build.gradle não encontrado"
      find . -maxdepth 5 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \)
      exit 1
    fi
    echo "Arquivo encontrado: $FILE"
    sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$FILE"
    sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' "$FILE"
          sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' app/android/app/build.gradle
          grep -n "compileSdk" app/android/app/build.gradle* || true

      - name: Habilitar internet no Android
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' app/android/app/src/main/AndroidManifest.xml

      - name: Instalar dependências
        working-directory: app
        run: flutter pub get

      - name: Analisar código
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: concursa-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
